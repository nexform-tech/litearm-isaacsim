# Test gate.
#
# Tests live in their own workflow: they run on pull requests, while the release
# workflow runs on pushes to the default branch. Mixing the two means a broken
# release blocks a pull request, or the reverse.
#
# The suite stays dependency-free on purpose. The three nodes import rclpy, the
# litearm SDK and Isaac Sim, none of which install on a plain CI runner, so this
# gate checks that every source file parses instead of importing it. Behaviour
# is covered by the on-hardware runs documented in README.md.
#
# AGENTS.md is deliberately not linted: it is canonical content synced from
# repo-template and must not be edited here.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a superseded pull request run is pointless

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "README.md"

      - name: Validate repository standards
        run: |
          set -euo pipefail
          test -s README.md
          test -s AGENTS.md
          test -s LICENSE
          python3 -c "import json; json.load(open('.releaserc.json'))"
          python3 -c "import json; json.load(open('.markdownlint.json'))"
          echo "repository standards OK"

      - name: Check Python and shell syntax
        run: |
          set -euo pipefail
          python3 -m py_compile *.py
          for f in *.sh; do
            [ -e "$f" ] || continue
            bash -n "$f"
          done
          echo "syntax OK"
